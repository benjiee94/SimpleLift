<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111315">
<title>SimpleLift</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #111315;
  color: #fff;
  min-height: 100vh;
}

header {
  padding: 24px 18px 16px;
  background: #181b1e;
  border-bottom: 1px solid #292d31;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -1px;
}

.logo span {
  opacity: .45;
}

.subtitle {
  color: #9da3a8;
  font-size: 13px;
  margin-top: 4px;
}

main {
  max-width: 650px;
  margin: auto;
  padding: 18px;
  padding-bottom: 100px;
}

.card {
  background: #181b1e;
  border: 1px solid #292d31;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 14px;
}

h2 {
  font-size: 20px;
  margin: 0 0 14px;
}

h3 {
  margin: 0;
  font-size: 17px;
}

.muted {
  color: #9da3a8;
  font-size: 13px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 13px 16px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  color: #fff;
  background: #292e33;
}

button:active {
  transform: scale(.97);
}

.primary {
  background: #fff;
  color: #111315;
}

.danger {
  background: #352023;
  color: #ff8c96;
}

.exercise {
  background: #202428;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
}

.exercise-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.exercise-name {
  font-weight: 750;
  font-size: 16px;
}

.sets {
  margin-top: 12px;
}

.set-row {
  display: grid;
  grid-template-columns: 38px 1fr 1fr 48px;
  gap: 7px;
  align-items: center;
  margin-bottom: 8px;
}

.set-number {
  color: #8e969c;
  font-size: 13px;
  text-align: center;
}

input {
  width: 100%;
  min-width: 0;
  border: 1px solid #343a40;
  border-radius: 9px;
  background: #111315;
  color: #fff;
  padding: 11px 8px;
  font-size: 16px;
  text-align: center;
  outline: none;
}

input:focus {
  border-color: #777;
}

.done {
  width: 48px;
  padding: 10px 0;
  font-size: 18px;
}

.done.completed {
  background: #fff;
  color: #111315;
}

.add-set {
  width: 100%;
  margin-top: 4px;
  background: transparent;
  border: 1px dashed #3a4046;
  color: #aeb4b9;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}

.stat {
  background: #202428;
  border-radius: 12px;
  padding: 12px 8px;
  text-align: center;
}

.stat-number {
  font-size: 20px;
  font-weight: 800;
}

.stat-label {
  font-size: 11px;
  color: #969da3;
  margin-top: 3px;
}

.week {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}

.day {
  text-align: center;
  padding: 9px 2px;
  background: #202428;
  border-radius: 9px;
  font-size: 11px;
  color: #969da3;
}

.day.active {
  background: #fff;
  color: #111315;
}

.day-dot {
  width: 6px;
  height: 6px;
  background: #777;
  border-radius: 50%;
  margin: 5px auto 0;
}

.day.active .day-dot {
  background: #111315;
}

.empty {
  text-align: center;
  padding: 28px 10px;
  color: #8e969c;
}

.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(17,19,21,.96);
  border-top: 1px solid #292d31;
  padding: 10px 18px calc(10px + env(safe-area-inset-bottom));
  z-index: 20;
}

.bottom-inner {
  max-width: 650px;
  margin: auto;
  display: flex;
  gap: 8px;
}

.bottom-inner button {
  flex: 1;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  display: none;
  align-items: flex-end;
  z-index: 50;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: 100%;
  max-width: 650px;
  margin: auto;
  background: #181b1e;
  border-radius: 20px 20px 0 0;
  padding: 20px;
  padding-bottom: calc(25px + env(safe-area-inset-bottom));
}

.modal-box input {
  text-align: left;
  margin: 12px 0;
}

.modal-actions {
  display: flex;
  gap: 8px;
}

.modal-actions button {
  flex: 1;
}

@media (min-width: 600px) {
  .modal {
    align-items: center;
  }

  .modal-box {
    border-radius: 20px;
    margin: 18px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-row">
    <div>
      <div class="logo">Simple<span>Lift</span></div>
      <div class="subtitle">Simple training. Simple tracking.</div>
    </div>
  </div>
</header>

<main>

  <div class="card">
    <h2>Today</h2>

    <div class="week" id="week"></div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-number" id="exerciseCount">0</div>
      <div class="stat-label">Exercises</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="setCount">0</div>
      <div class="stat-label">Sets</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="completedCount">0</div>
      <div class="stat-label">Done</div>
    </div>
  </div>

  <div class="card">
    <h2>Workout</h2>

    <div id="exerciseList"></div>

    <div id="emptyMessage" class="empty">
      No exercises yet.<br><br>
      Add your first exercise below.
    </div>
  </div>

</main>

<div class="bottom-bar">
  <div class="bottom-inner">
    <button class="primary" onclick="openAddExercise()">
      + Add Exercise
    </button>

    <button onclick="clearWorkout()">
      Clear
    </button>
  </div>
</div>

<div class="modal" id="exerciseModal">
  <div class="modal-box">
    <h2>Add Exercise</h2>

    <div class="muted">
      Enter the exercise you want to track.
    </div>

    <input
      id="exerciseInput"
      type="text"
      placeholder="e.g. Bench Press"
      autocomplete="off"
    >

    <div class="modal-actions">
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="addExercise()">Add Exercise</button>
    </div>
  </div>
</div>

<script>

const STORAGE_KEY = "simplelift_workout";

let workout = loadWorkout();

function loadWorkout() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);

    if (saved) {
      return JSON.parse(saved);
    }
  } catch (error) {
    console.log(error);
  }

  return {
    date: todayKey(),
    exercises: []
  };
}

function saveWorkout() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(workout));
}

function todayKey() {
  const d = new Date();

  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

function renderWeek() {

  const container = document.getElementById("week");

  container.innerHTML = "";

  const today = new Date();

  const names = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  for (let i = 0; i < 7; i++) {

    const d = new Date(today);

    d.setDate(today.getDate() - today.getDay() + i);

    const isToday =
      d.toDateString() === today.toDateString();

    const div = document.createElement("div");

    div.className = "day" + (isToday ? " active" : "");

    div.innerHTML =
      names[i] +
      "<div class='day-dot'></div>";

    container.appendChild(div);
  }
}

function render() {

  const list = document.getElementById("exerciseList");
  const empty = document.getElementById("emptyMessage");

  list.innerHTML = "";

  if (workout.exercises.length === 0) {
    empty.style.display = "block";
  } else {
    empty.style.display = "none";
  }

  let totalSets = 0;
  let completedSets = 0;

  workout.exercises.forEach((exercise, exerciseIndex) => {

    const card = document.createElement("div");

    card.className = "exercise";

    let setsHTML = "";

    exercise.sets.forEach((set, setIndex) => {

      totalSets++;

      if (set.completed) {
        completedSets++;
      }

      setsHTML += `
        <div class="set-row">

          <div class="set-number">
            ${setIndex + 1}
          </div>

          <input
            type="number"
            inputmode="decimal"
            placeholder="kg"
            value="${set.weight || ""}"
            onchange="updateSet(${exerciseIndex},${setIndex},'weight',this.value)"
          >

          <input
            type="number"
            inputmode="numeric"
            placeholder="reps"
            value="${set.reps || ""}"
            onchange="updateSet(${exerciseIndex},${setIndex},'reps',this.value)"
          >

          <button
            class="done ${set.completed ? "completed" : ""}"
            onclick="toggleSet(${exerciseIndex},${setIndex})"
          >
            ✓
          </button>

        </div>
      `;
    });

    card.innerHTML = `

      <div class="exercise-top">

        <div class="exercise-name">
          ${escapeHTML(exercise.name)}
        </div>

        <button
          class="danger"
          onclick="removeExercise(${exerciseIndex})"
        >
          Delete
        </button>

      </div>

      <div class="sets">

        ${setsHTML}

        <button
          class="add-set"
          onclick="addSet(${exerciseIndex})"
        >
          + Add Set
        </button>

      </div>
    `;

    list.appendChild(card);
  });

  document.getElementById("exerciseCount").textContent =
    workout.exercises.length;

  document.getElementById("setCount").textContent =
    totalSets;

  document.getElementById("completedCount").textContent =
    completedSets;
}

function escapeHTML(text) {

  return text
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function openAddExercise() {

  document.getElementById("exerciseModal")
    .classList.add("show");

  setTimeout(() => {
    document.getElementById("exerciseInput").focus();
  }, 100);
}

function closeModal() {

  document.getElementById("exerciseModal")
    .classList.remove("show");

  document.getElementById("exerciseInput").value = "";
}

function addExercise() {

  const input =
    document.getElementById("exerciseInput");

  const name = input.value.trim();

  if (!name) return;

  workout.exercises.push({
    name: name,
    sets: [
      {
        weight: "",
        reps: "",
        completed: false
      }
    ]
  });

  saveWorkout();
  render();
  closeModal();
}

function removeExercise(index) {

  if (!confirm("Delete this exercise?")) {
    return;
  }

  workout.exercises.splice(index, 1);

  saveWorkout();
  render();
}

function addSet(exerciseIndex) {

  workout.exercises[exerciseIndex].sets.push({
    weight: "",
    reps: "",
    completed: false
  });

  saveWorkout();
  render();
}

function updateSet(exerciseIndex, setIndex, field, value) {

  workout.exercises[exerciseIndex]
    .sets[setIndex][field] = value;

  saveWorkout();
}

function toggleSet(exerciseIndex, setIndex) {

  const set =
    workout.exercises[exerciseIndex].sets[setIndex];

  set.completed = !set.completed;

  saveWorkout();
  render();
}

function clearWorkout() {

  if (!confirm("Clear today's workout?")) {
    return;
  }

  workout.exercises = [];

  saveWorkout();
  render();
}

document
  .getElementById("exerciseModal")
  .addEventListener("click", function(e) {

    if (e.target === this) {
      closeModal();
    }

  });

document
  .getElementById("exerciseInput")
  .addEventListener("keydown", function(e) {

    if (e.key === "Enter") {
      addExercise();
    }

  });

renderWeek();
render();

</script>

</body>
</html>
