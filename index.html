<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#111315"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="SimpleLift"
  >

  <title>SimpleLift</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: #111315;
    }

    body {
      margin: 0;
      background: #111315;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      min-height: 100vh;
      padding-bottom: 110px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    header {
      padding:
        calc(24px + env(safe-area-inset-top))
        18px
        22px;

      border-bottom: 1px solid #292d31;
      background: #171a1d;
    }

    .brand {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
    }

    .brand span {
      color: #85898e;
      font-weight: 700;
    }

    .tagline {
      margin-top: 8px;
      color: #9ba0a5;
      font-size: 19px;
    }

    main {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      padding: 22px 18px;
    }

    .section-card {
      background: #191c1f;
      border: 1px solid #30353a;
      border-radius: 28px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow:
        0 4px 18px rgba(0,0,0,.15);
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 18px;
    }

    h2 {
      font-size: 25px;
      margin-bottom: 18px;
    }

    h3 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .day {
      background: #202428;
      color: #9ba0a5;
      border-radius: 15px;
      min-height: 70px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-size: 15px;
    }

    .day.active {
      background: #fff;
      color: #111315;
    }

    .day-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #777d82;
    }

    .day.active .day-dot {
      background: #111315;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat {
      background: #202428;
      border-radius: 20px;
      padding: 18px 8px;
      text-align: center;
    }

    .stat-number {
      font-size: 30px;
      font-weight: 800;
    }

    .stat-label {
      color: #9ba0a5;
      margin-top: 4px;
      font-size: 15px;
    }

    .empty {
      text-align: center;
      padding: 55px 20px;
      color: #8e949a;
      font-size: 19px;
      line-height: 1.6;
    }

    .exercise {
      background: #202428;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .exercise-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .exercise-name {
      font-size: 21px;
      font-weight: 750;
      word-break: break-word;
    }

    .delete-btn {
      background: #452126;
      color: #ff9ba4;
      padding: 12px 18px;
      border-radius: 14px;
      font-weight: 700;
    }

    .set-row {
      display: grid;
      grid-template-columns: 35px 1fr 1fr 68px;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .set-number {
      color: #8e949a;
      text-align: center;
    }

    .input {
      width: 100%;
      min-width: 0;
      background: #111315;
      border: 1px solid #3b4147;
      color: #fff;
      border-radius: 15px;
      padding: 15px 12px;
      text-align: center;
      outline: none;
    }

    .input:focus {
      border-color: #fff;
    }

    .complete-btn {
      width: 68px;
      height: 58px;
      background: #111315;
      border: 1px solid #3b4147;
      color: transparent;
      border-radius: 15px;
      font-size: 25px;
      font-weight: 800;
    }

    .complete-btn.done {
      background: #fff;
      color: #111315;
    }

    .add-set {
      width: 100%;
      background: transparent;
      border: 1px dashed #4a5056;
      color: #b7bcc1;
      border-radius: 16px;
      padding: 16px;
      margin-top: 6px;
      font-weight: 700;
    }

    .add-set:active,
    .delete-btn:active,
    .primary:active,
    .secondary:active {
      transform: scale(.98);
    }

    .bottom-bar {
      position: fixed;
      z-index: 50;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(17,19,21,.96);
      border-top: 1px solid #30353a;
      padding:
        12px
        18px
        calc(12px + env(safe-area-inset-bottom));
      backdrop-filter: blur(15px);
    }

    .bottom-inner {
      max-width: 850px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      gap: 10px;
    }

    .primary,
    .secondary {
      min-height: 58px;
      border-radius: 18px;
      font-weight: 750;
      font-size: 17px;
      padding: 12px;
    }

    .primary {
      background: #fff;
      color: #111315;
    }

    .secondary {
      background: #292e33;
      color: #fff;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      inset: 0;
      background: rgba(0,0,0,.72);
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      background: #191c1f;
      border: 1px solid #3a4046;
      border-radius: 25px;
      padding: 22px;
    }

    .modal-box h2 {
      margin-bottom: 20px;
    }

    .modal-input {
      width: 100%;
      background: #111315;
      border: 1px solid #3b4147;
      color: #fff;
      border-radius: 15px;
      padding: 17px;
      outline: none;
      margin-bottom: 14px;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .modal-actions button {
      min-height: 55px;
      border-radius: 16px;
      background: #292e33;
      color: #fff;
      font-weight: 700;
    }

    .modal-actions .save {
      background: #fff;
      color: #111315;
    }

    .history-card {
      background: #202428;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 12px;
    }

    .history-date {
      font-size: 20px;
      font-weight: 750;
      margin-bottom: 5px;
    }

    .history-summary {
      color: #9ba0a5;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .history-exercise {
      border-top: 1px solid #34393e;
      padding-top: 12px;
      margin-top: 12px;
    }

    .history-exercise-name {
      font-weight: 700;
      margin-bottom: 7px;
    }

    .history-set {
      color: #aeb3b8;
      font-size: 14px;
      margin-top: 4px;
    }

    .history-empty {
      text-align: center;
      color: #8e949a;
      padding: 35px 15px;
      line-height: 1.5;
    }

    .clear-history {
      width: 100%;
      background: #452126;
      color: #ff9ba4;
      padding: 15px;
      border-radius: 15px;
      font-weight: 700;
      margin-top: 8px;
    }

    @media (max-width: 520px) {

      .brand {
        font-size: 37px;
      }

      .days {
        gap: 5px;
      }

      .day {
        min-height: 64px;
        border-radius: 13px;
        font-size: 13px;
      }

      .section-card {
        padding: 17px;
        border-radius: 23px;
      }

      .set-row {
        grid-template-columns: 25px 1fr 1fr 58px;
        gap: 7px;
      }

      .complete-btn {
        width: 58px;
      }

      .bottom-inner {
        grid-template-columns: 1.2fr 1fr 1fr;
        gap: 7px;
      }

      .primary,
      .secondary {
        min-height: 55px;
        font-size: 14px;
        padding: 8px;
      }
    }

  </style>
</head>

<body>

<header>
  <div class="brand">
    Simple<span>Lift</span>
  </div>

  <div class="tagline">
    Simple training. Simple tracking.
  </div>
</header>

<main>

  <div class="section-card">

    <h1>Today</h1>

    <div class="days" id="days"></div>

  </div>

  <div class="stats">

    <div class="stat">
      <div
        class="stat-number"
        id="exerciseCount"
      >
        0
      </div>

      <div class="stat-label">
        Exercises
      </div>
    </div>

    <div class="stat">
      <div
        class="stat-number"
        id="setCount"
      >
        0
      </div>

      <div class="stat-label">
        Sets
      </div>
    </div>

    <div class="stat">
      <div
        class="stat-number"
        id="doneCount"
      >
        0
      </div>

      <div class="stat-label">
        Done
      </div>
    </div>

  </div>

  <div class="section-card">

    <h2>Workout</h2>

    <div id="workout"></div>

  </div>

</main>

<div class="bottom-bar">

  <div class="bottom-inner">

    <button
      class="primary"
      onclick="openAddExercise()"
    >
      + Add Exercise
    </button>

    <button
      class="secondary"
      onclick="openHistory()"
    >
      History
    </button>

    <button
      class="secondary"
      onclick="clearWorkout()"
    >
      Clear
    </button>

  </div>

</div>


<!-- ADD EXERCISE MODAL -->

<div
  class="modal"
  id="exerciseModal"
>

  <div class="modal-box">

    <h2>
      Add Exercise
    </h2>

    <input
      class="modal-input"
      id="exerciseName"
      type="text"
      placeholder="Exercise name"
      autocomplete="off"
    >

    <div class="modal-actions">

      <button
        onclick="closeAddExercise()"
      >
        Cancel
      </button>

      <button
        class="save"
        onclick="addExercise()"
      >
        Add Exercise
      </button>

    </div>

  </div>

</div>


<!-- HISTORY MODAL -->

<div
  class="modal"
  id="historyModal"
>

  <div class="modal-box">

    <h2>
      Workout History
    </h2>

    <div id="historyList"></div>

    <div class="modal-actions">

      <button
        onclick="closeHistory()"
      >
        Close
      </button>

    </div>

  </div>

</div>


<script>

  const STORAGE_KEY = "simplelift_workout_v2";
  const HISTORY_KEY = "simplelift_history_v1";


  /* -----------------------------
     DATE
  ----------------------------- */

  function todayKey() {

    const now = new Date();

    const year = now.getFullYear();

    const month = String(
      now.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
      now.getDate()
    ).padStart(2, "0");

    return `${year}-${month}-${day}`;
  }


  /* -----------------------------
     DEFAULT WORKOUT
  ----------------------------- */

  function emptyWorkout() {

    return {
      date: todayKey(),
      exercises: []
    };

  }


  /* -----------------------------
     LOAD WORKOUT
  ----------------------------- */

  function loadWorkout() {

    try {

      const saved =
        localStorage.getItem(STORAGE_KEY);

      if (!saved) {
        return emptyWorkout();
      }

      const workout =
        JSON.parse(saved);

      /*
       If the saved workout belongs
       to an earlier day, archive it.
      */

      if (
        workout.date &&
        workout.date !== todayKey()
      ) {

        archiveWorkout(workout);

        return emptyWorkout();

      }

      return workout;

    } catch (error) {

      console.log(error);

      return emptyWorkout();

    }

  }


  /* -----------------------------
     SAVE WORKOUT
  ----------------------------- */

  function saveWorkout() {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(workout)
    );

  }


  /* -----------------------------
     HISTORY
  ----------------------------- */

  function loadHistory() {

    try {

      const saved =
        localStorage.getItem(HISTORY_KEY);

      if (!saved) {
        return [];
      }

      return JSON.parse(saved);

    } catch (error) {

      console.log(error);

      return [];

    }

  }


  function saveHistory(history) {

    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(history)
    );

  }


  function archiveWorkout(session) {

    if (
      !session ||
      !session.exercises ||
      session.exercises.length === 0
    ) {
      return;
    }


    const history =
      loadHistory();


    const copy =
      JSON.parse(
        JSON.stringify(session)
      );


    const existingIndex =
      history.findIndex(
        item => item.date === copy.date
      );


    if (existingIndex >= 0) {

      history[existingIndex] = copy;

    } else {

      history.push(copy);

    }


    history.sort(
      (a, b) =>
        b.date.localeCompare(a.date)
    );


    saveHistory(history);

  }


  /* -----------------------------
     ESCAPE HTML
  ----------------------------- */

  function escapeHTML(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* -----------------------------
     MAIN WORKOUT
  ----------------------------- */

  let workout =
    loadWorkout();


  /* -----------------------------
     RENDER
  ----------------------------- */

  function render() {

    renderDays();

    renderWorkout();

    updateStats();

  }


  /* -----------------------------
     DAYS
  ----------------------------- */

  function renderDays() {

    const container =
      document.getElementById("days");

    container.innerHTML = "";

    const today =
      new Date();


    const names = [
      "Sun",
      "Mon",
      "Tue",
      "Wed",
      "Thu",
      "Fri",
      "Sat"
    ];


    names.forEach(
      (name, index) => {

        const button =
          document.createElement("div");

        button.className =
          "day";


        if (
          index === today.getDay()
        ) {

          button.classList.add(
            "active"
          );

        }


        button.innerHTML = `
          <div>${name}</div>
          <div class="day-dot"></div>
        `;


        container.appendChild(
          button
        );

      }
    );

  }


  /* -----------------------------
     RENDER WORKOUT
  ----------------------------- */

  function renderWorkout() {

    const container =
      document.getElementById(
        "workout"
      );

    container.innerHTML = "";


    if (
      workout.exercises.length === 0
    ) {

      container.innerHTML = `
        <div class="empty">
          No exercises yet.<br><br>
          Add your first exercise below.
        </div>
      `;

      return;

    }


    workout.exercises.forEach(
      (exercise, exerciseIndex) => {

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "exercise";


        let setsHTML = "";


        exercise.sets.forEach(
          (set, setIndex) => {

            setsHTML += `
              <div class="set-row">

                <div class="set-number">
                  ${setIndex + 1}
                </div>

                <input
                  class="input"
                  type="number"
                  inputmode="decimal"
                  placeholder="kg"
                  value="${escapeHTML(set.weight)}"
                  onchange="
                    updateSet(
                      ${exerciseIndex},
                      ${setIndex},
                      'weight',
                      this.value
                    )
                  "
                >

                <input
                  class="input"
                  type="number"
                  inputmode="numeric"
                  placeholder="reps"
                  value="${escapeHTML(set.reps)}"
                  onchange="
                    updateSet(
                      ${exerciseIndex},
                      ${setIndex},
                      'reps',
                      this.value
                    )
                  "
                >

                <button
                  class="complete-btn ${set.completed ? "done" : ""}"
                  onclick="
                    toggleSet(
                      ${exerciseIndex},
                      ${setIndex}
                    )
                  "
                >
                  ✓
                </button>

              </div>
            `;

          }
        );


        card.innerHTML = `

          <div class="exercise-header">

            <div class="exercise-name">
              ${escapeHTML(exercise.name)}
            </div>

            <button
              class="delete-btn"
              onclick="
                deleteExercise(
                  ${exerciseIndex}
                )
              "
            >
              Delete
            </button>

          </div>

          ${setsHTML}

          <button
            class="add-set"
            onclick="
              addSet(
                ${exerciseIndex}
              )
            "
          >
            + Add Set
          </button>

        `;


        container.appendChild(
          card
        );

      }
    );

  }


  /* -----------------------------
     STATS
  ----------------------------- */

  function updateStats() {

    let totalSets = 0;

    let completedSets = 0;


    workout.exercises.forEach(
      exercise => {

        totalSets +=
          exercise.sets.length;


        exercise.sets.forEach(
          set => {

            if (set.completed) {
              completedSets++;
            }

          }
        );

      }
    );


    document.getElementById(
      "exerciseCount"
    ).textContent =
      workout.exercises.length;


    document.getElementById(
      "setCount"
    ).textContent =
      totalSets;


    document.getElementById(
      "doneCount"
    ).textContent =
      completedSets;

  }


  /* -----------------------------
     ADD EXERCISE
  ----------------------------- */

  function openAddExercise() {

    document
      .getElementById(
        "exerciseModal"
      )
      .classList.add("show");


    setTimeout(
      () => {

        document
          .getElementById(
            "exerciseName"
          )
          .focus();

      },
      100
    );

  }


  function closeAddExercise() {

    document
      .getElementById(
        "exerciseModal"
      )
      .classList.remove("show");


    document
      .getElementById(
        "exerciseName"
      )
      .value = "";

  }


  function addExercise() {

    const input =
      document.getElementById(
        "exerciseName"
      );


    const name =
      input.value.trim();


    if (!name) {

      input.focus();

      return;

    }


    workout.exercises.push({

      name: name,

      sets: [
        {
          weight: "",
          reps: "",
          completed: false
        }
      ]

    });


    saveWorkout();

    render();

    closeAddExercise();

  }


  /* -----------------------------
     DELETE EXERCISE
  ----------------------------- */

  function deleteExercise(
    exerciseIndex
  ) {

    if (
      !confirm(
        "Delete this exercise?"
      )
    ) {
      return;
    }


    workout.exercises.splice(
      exerciseIndex,
      1
    );


    saveWorkout();

    render();

  }


  /* -----------------------------
     ADD SET
  ----------------------------- */

  function addSet(
    exerciseIndex
  ) {

    workout
      .exercises[
        exerciseIndex
      ]
      .sets
      .push({

        weight: "",
        reps: "",
        completed: false

      });


    saveWorkout();

    render();

  }


  /* -----------------------------
     UPDATE SET
  ----------------------------- */

  function updateSet(
    exerciseIndex,
    setIndex,
    field,
    value
  ) {

    workout
      .exercises[
        exerciseIndex
      ]
      .sets[
        setIndex
      ][field] = value;


    saveWorkout();

  }


  /* -----------------------------
     COMPLETE SET
  ----------------------------- */

  function toggleSet(
    exerciseIndex,
    setIndex
  ) {

    const set =
      workout
        .exercises[
          exerciseIndex
        ]
        .sets[
          setIndex
        ];


    set.completed =
      !set.completed;


    saveWorkout();

    render();

  }


  /* -----------------------------
     CLEAR TODAY
  ----------------------------- */

  function clearWorkout() {

    if (
      workout.exercises.length === 0
    ) {

      return;

    }


    if (
      !confirm(
        "Save today's workout to History and clear it?"
      )
    ) {

      return;

    }


    archiveWorkout(
      workout
    );


    workout =
      emptyWorkout();


    saveWorkout();

    render();

  }


  /* -----------------------------
     HISTORY MODAL
  ----------------------------- */

  function openHistory() {

    renderHistory();


    document
      .getElementById(
        "historyModal"
      )
      .classList.add("show");

  }


  function closeHistory() {

    document
      .getElementById(
        "historyModal"
      )
      .classList.remove("show");

  }


  /* -----------------------------
     FORMAT HISTORY DATE
  ----------------------------- */

  function formatHistoryDate(
    dateString
  ) {

    const date =
      new Date(
        dateString + "T12:00:00"
      );


    return date.toLocaleDateString(
      "en-GB",
      {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    );

  }


  /* -----------------------------
     RENDER HISTORY
  ----------------------------- */

  function renderHistory() {

    const container =
      document.getElementById(
        "historyList"
      );


    const history =
      loadHistory();


    container.innerHTML = "";


    if (history.length === 0) {

      container.innerHTML = `
        <div class="history-empty">
          No previous workouts yet.
          <br><br>
          Your completed workouts will
          appear here automatically.
        </div>
      `;

      return;

    }


    history.forEach(
      session => {

        let totalSets = 0;

        let completedSets = 0;


        session.exercises.forEach(
          exercise => {

            totalSets +=
              exercise.sets.length;


            exercise.sets.forEach(
              set => {

                if (set.completed) {
                  completedSets++;
                }

              }
            );

          }
        );


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "history-card";


        let exercisesHTML = "";


        session.exercises.forEach(
          exercise => {

            let setsHTML = "";


            exercise.sets.forEach(
              (set, index) => {

                setsHTML += `
                  <div class="history-set">
                    Set ${index + 1}:
                    ${set.weight || "-"} kg
                    ×
                    ${set.reps || "-"}
                    ${set.completed ? " ✓" : ""}
                  </div>
                `;

              }
            );


            exercisesHTML += `
              <div class="history-exercise">

                <div class="history-exercise-name">
                  ${escapeHTML(
                    exercise.name
                  )}
                </div>

                ${setsHTML}

              </div>
            `;

          }
        );


        card.innerHTML = `

          <div class="history-date">
            ${formatHistoryDate(
              session.date
            )}
          </div>

          <div class="history-summary">
            ${session.exercises.length}
            exercise${session.exercises.length === 1 ? "" : "s"}
            ·
            ${totalSets} sets
            ·
            ${completedSets} completed
          </div>

          ${exercisesHTML}

        `;


        container.appendChild(
          card
        );

      }
    );


    const clearButton =
      document.createElement(
        "button"
      );


    clearButton.className =
      "clear-history";


    clearButton.textContent =
      "Delete All History";


    clearButton.onclick =
      clearHistory;


    container.appendChild(
      clearButton
    );

  }


  /* -----------------------------
     CLEAR HISTORY
  ----------------------------- */

  function clearHistory() {

    if (
      !confirm(
        "Delete all workout history?"
      )
    ) {

      return;

    }


    localStorage.removeItem(
      HISTORY_KEY
    );


    renderHistory();

  }


  /* -----------------------------
     CLOSE MODALS ON BACKDROP
  ----------------------------- */

  document
    .getElementById(
      "exerciseModal"
    )
    .addEventListener(
      "click",
      event => {

        if (
          event.target.id ===
          "exerciseModal"
        ) {

          closeAddExercise();

        }

      }
    );


  document
    .getElementById(
      "historyModal"
    )
    .addEventListener(
      "click",
      event => {

        if (
          event.target.id ===
          "historyModal"
        ) {

          closeHistory();

        }

      }
    );


  /* -----------------------------
     ENTER KEY FOR EXERCISE
  ----------------------------- */

  document
    .getElementById(
      "exerciseName"
    )
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          addExercise();

        }

      }
    );


  /* -----------------------------
     START APP
  ----------------------------- */

  render();


  /* -----------------------------
     SERVICE WORKER
  ----------------------------- */

  if (
    "serviceWorker" in navigator
  ) {

    window.addEventListener(
      "load",
      () => {

        navigator.serviceWorker
          .register(
            "./service-worker.js"
          )
          .catch(
            error =>
              console.log(
                "Service worker:",
                error
              )
          );

      }
    );

  }

</script>

</body>
</html>
